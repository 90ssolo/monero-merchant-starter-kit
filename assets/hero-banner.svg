<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="320" role="img" aria-label="Monero Merchant Starter Kit - Editable counter cards, invoice templates, cashier guides, refund runbooks, and accounting records">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="55%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6600"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <style>
      .eyebrow { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 2px; fill: #FB923C; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: #F9FAFB; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 18px; fill: #9CA3AF; }
      .pill-bg { fill: #1F2937; stroke: #374151; stroke-width: 1.5; }
      .pill-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #F3F4F6; }
      .pill-dot { fill: #FF6600; }
    </style>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" rx="3" fill="url(#accent)"/>

  <!-- Official Monero Symbol -->
  <g transform="translate(960, 82) scale(2.1)">
    <circle cx="37.3" cy="37.3" r="37.2" fill="#FFFFFF"/>
    <path d="m 37.3,0.35329395 c -20.377,0 -36.903,16.524 -36.903,36.902 0,4.074 0.66,7.992 1.88,11.657 l 11.036,0 0,-31.049 23.987,23.987 23.987,-23.987 0,31.049 11.037,0 c 1.22,-3.665 1.88,-7.583 1.88,-11.657 0,-20.378 -16.526,-36.902 -36.904,-36.902" fill="#FF6600"/>
    <path d="m 21.3164,36.895994 0,19.537 -15.55,0 c 6.478,10.628 18.178,17.726 31.533,17.726 13.355,0 25.056,-7.098 31.533,-17.726 l -15.549,0 0,-19.537 -15.984,15.984 z" fill="#4C4C4C"/>
  </g>

  <text class="eyebrow" x="64" y="68">PRACTICAL MERCHANT OPERATIONS TOOLKIT</text>
  <text class="title" x="64" y="122">Monero Merchant Starter Kit</text>
  <text class="sub" x="64" y="164">Editable counter cards, invoice examples, cashier quick-start sheets, payment verification</text>
  <text class="sub" x="64" y="192">checklists, refund runbooks, and end-of-day accounting records for accepting XMR.</text>

  <g transform="translate(64, 228)">
    <rect class="pill-bg" x="0" y="0" width="160" height="36" rx="18"/>
    <circle class="pill-dot" cx="20" cy="18" r="4"/>
    <text class="pill-label" x="34" y="23">SVG Counter Cards</text>

    <rect class="pill-bg" x="174" y="0" width="160" height="36" rx="18"/>
    <circle class="pill-dot" cx="194" cy="18" r="4"/>
    <text class="pill-label" x="208" y="23">Invoice Templates</text>

    <rect class="pill-bg" x="348" y="0" width="185" height="36" rx="18"/>
    <circle class="pill-dot" cx="368" cy="18" r="4"/>
    <text class="pill-label" x="382" y="23">Cashier &amp; Refund SOPs</text>

    <rect class="pill-bg" x="547" y="0" width="185" height="36" rx="18"/>
    <circle class="pill-dot" cx="567" cy="18" r="4"/>
    <text class="pill-label" x="581" y="23">End-of-Day CSV Ledgers</text>
  </g>
</svg>
