<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1120" width="800" height="1120" role="img" aria-label="Monero Accepted Here - Printable 5x7 portrait counter display card">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; fill: #111827; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; fill: #4B5563; }
      .instruction { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; fill: #1F2937; }
      .footer-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; fill: #6B7280; }
    </style>
    <filter id="card-shadow" x="-5%" y="-3%" width="110%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1120" fill="#F9FAFB"/>

  <!-- Printable Card Container (5" x 7" Aspect Ratio) -->
  <rect x="60" y="50" width="680" height="1020" rx="28" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2" filter="url(#card-shadow)"/>

  <!-- Top Accent Bar: Monero Orange -->
  <path d="M 60 78 Q 60 50 88 50 L 712 50 Q 740 50 740 78 L 740 66 L 60 66 Z" fill="#FF6600"/>

  <!-- Official Monero Symbol (Exact vector path from official brand assets) -->
  <g transform="translate(332.8, 100) scale(1.8)">
    <circle cx="37.3" cy="37.3" r="37.2" fill="#FFFFFF"/>
    <path d="m 37.3,0.35329395 c -20.377,0 -36.903,16.524 -36.903,36.902 0,4.074 0.66,7.992 1.88,11.657 l 11.036,0 0,-31.049 23.987,23.987 23.987,-23.987 0,31.049 11.037,0 c 1.22,-3.665 1.88,-7.583 1.88,-11.657 0,-20.378 -16.526,-36.902 -36.904,-36.902" fill="#FF6600"/>
    <path d="m 21.3164,36.895994 0,19.537 -15.55,0 c 6.478,10.628 18.178,17.726 31.533,17.726 13.355,0 25.056,-7.098 31.533,-17.726 l -15.549,0 0,-19.537 -15.984,15.984 z" fill="#4C4C4C"/>
  </g>

  <!-- Headers -->
  <text class="title" x="400" y="286" font-size="38" text-anchor="middle">MONERO ACCEPTED HERE</text>
  <text class="subtitle" x="400" y="324" font-size="19" text-anchor="middle">Private, peer-to-peer digital cash (XMR)</text>

  <!-- QR Code Frame / Placement Guide -->
  <rect x="210" y="366" width="380" height="380" rx="22" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Corner Finder Guides -->
  <path d="M 236 416 L 236 392 L 260 392" fill="none" stroke="#FF6600" stroke-width="4" stroke-linecap="round"/>
  <path d="M 564 416 L 564 392 L 540 392" fill="none" stroke="#FF6600" stroke-width="4" stroke-linecap="round"/>
  <path d="M 236 696 L 236 720 L 260 720" fill="none" stroke="#FF6600" stroke-width="4" stroke-linecap="round"/>
  <path d="M 564 696 L 564 720 L 540 720" fill="none" stroke="#FF6600" stroke-width="4" stroke-linecap="round"/>

  <text class="instruction" x="400" y="542" font-size="20" text-anchor="middle" fill="#374151">Place Merchant QR Code Here</text>
  <text class="subtitle" x="400" y="574" font-size="15" text-anchor="middle" fill="#6B7280">Subaddress QR or Dynamic Till Screen</text>

  <!-- Store Name / Address Line -->
  <text class="instruction" x="400" y="790" font-size="17" text-anchor="middle" fill="#374151">MERCHANT / STORE NAME: ____________________________</text>

  <!-- Instructions Container -->
  <rect x="120" y="824" width="560" height="158" rx="16" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>

  <text class="instruction" x="400" y="864" font-size="19" text-anchor="middle">How to Pay at the Counter:</text>
  <text class="subtitle" x="400" y="898" font-size="16" text-anchor="middle">1. Ask staff for your total or check the counter till screen</text>
  <text class="subtitle" x="400" y="928" font-size="16" text-anchor="middle">2. Scan the QR code with any Monero wallet &amp; confirm the XMR amount</text>
  <text class="subtitle" x="400" y="958" font-size="16" text-anchor="middle">3. Wait a moment for the merchant's till to confirm receipt</text>

  <!-- Footer Notice -->
  <text class="footer-text" x="400" y="1028" font-size="13.5" text-anchor="middle">Direct wallet-to-wallet settlement • Please keep your TXID for receipts or refunds</text>
</svg>
